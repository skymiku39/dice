<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>骰子多方向投擲版 - 進階物理模擬</title>
    <style>
      :root {
        --dice-size: 60px;
        --half-size: 30px;
        --offset: 30.1px;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: var(--bg-color, #e5e5e5);
        overflow: hidden;
        font-family: "Microsoft JhengHei", sans-serif;
      }

      .controls {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 1000;
        max-width: 320px;
        max-height: calc(100vh - 40px);
        overflow-y: auto;
      }

      .controls h3 {
        margin: 0 0 15px 0;
        color: #333;
        border-bottom: 2px solid #333;
        padding-bottom: 10px;
      }

      .control-group {
        margin-bottom: 15px;
      }

      .control-group label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-weight: bold;
        font-size: 14px;
      }

      .control-group input[type="range"] {
        width: 100%;
        margin: 5px 0;
      }

      .control-group .value-display {
        display: inline-block;
        min-width: 60px;
        text-align: right;
        color: #2196f3;
        font-weight: bold;
      }

      .direction-selector {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
        margin-top: 10px;
      }

      .direction-btn {
        padding: 10px;
        background: #f0f0f0;
        border: 2px solid #ccc;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 12px;
        text-align: center;
      }

      .direction-btn:hover {
        background: #e0e0e0;
      }

      .direction-btn.active {
        background: #2196f3;
        color: white;
        border-color: #1976d2;
      }

      .direction-btn.placeholder {
        visibility: hidden;
      }

      .theme-selector {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .theme-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px;
        border-radius: 16px;
        border: 2px solid #ddd;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 11px;
        background: #f8f8f8;
        white-space: nowrap;
      }

      .theme-btn:hover {
        border-color: #999;
        transform: scale(1.05);
      }

      .theme-btn.active {
        border-color: #2196f3;
        box-shadow: 0 0 6px rgba(33, 150, 243, 0.3);
        font-weight: bold;
      }

      .theme-btn .color-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.15);
        flex-shrink: 0;
      }

      .scene {
        width: var(--scene-width, 800px);
        height: var(--scene-height, 600px);
        perspective: var(--perspective, 2000px);
      }

      .inner-scene {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transform: rotateX(var(--scene-rotation, 30deg));
      }

      .shadow-layer,
      .dice-layer {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
      }

      .dice-group {
        position: absolute;
        top: 50%;
        left: 50%;
        width: var(--dice-size);
        height: var(--dice-size);
        margin-left: calc(var(--dice-size) / -2);
        margin-top: calc(var(--dice-size) / -2);
        transform-style: preserve-3d;
      }

      .dice-wrapper {
        transform-style: preserve-3d;
        will-change: transform;
      }

      .dice {
        width: var(--dice-size);
        height: var(--dice-size);
        transform-style: preserve-3d;
      }

      .face {
        position: absolute;
        width: var(--dice-size);
        height: var(--dice-size);
        background: var(--dice-face-color, #fff);
        border: 1px solid var(--dice-border-color, #ccc);
        border-radius: var(--dice-radius, 10px);
        display: grid;
        padding: var(--face-padding, 6px);
        box-sizing: border-box;
        grid-template: repeat(3, 1fr) / repeat(3, 1fr);
        backface-visibility: hidden;
        box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
      }

      .dot {
        background: var(--normal-dot-color, #333);
        border-radius: 50%;
        width: var(--dot-size, 10px);
        height: var(--dot-size, 10px);
        align-self: center;
        justify-self: center;
      }

      .face-1 .dot {
        background: var(--special-dot-color, #d32f2f);
        width: var(--special-dot-size, 20px);
        height: var(--special-dot-size, 20px);
      }

      .face-4 .dot {
        background: var(--special-dot-color, #d32f2f);
      }

      .face-1 {
        transform: rotateY(0deg) translateZ(var(--offset));
      }
      .face-2 {
        transform: rotateY(90deg) translateZ(var(--offset));
      }
      .face-3 {
        transform: rotateY(180deg) translateZ(var(--offset));
      }
      .face-4 {
        transform: rotateY(-90deg) translateZ(var(--offset));
      }
      .face-5 {
        transform: rotateX(90deg) translateZ(var(--offset));
      }
      .face-6 {
        transform: rotateX(-90deg) translateZ(var(--offset));
      }

      .shadow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: var(--dice-size);
        height: var(--dice-size);
        margin-left: calc(var(--dice-size) / -2);
        margin-top: calc(var(--dice-size) / -2);
        background: rgba(0, 0, 0, 0.25);
        border-radius: 50%;
        filter: blur(var(--shadow-blur, 10px));
        opacity: 0;
        transform: translateZ(-1px);
        will-change: transform, opacity;
      }

      .roll-button {
        z-index: 1000;
        margin-top: 50px;
        padding: 15px 50px;
        cursor: pointer;
        border-radius: 50px;
        border: none;
        background: #222;
        color: white;
        font-size: 18px;
        font-weight: bold;
        transition: 0.3s;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      .roll-button:hover {
        background: #444;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      }

      .roll-button:disabled {
        background: #888;
        cursor: not-allowed;
        transform: none;
      }

      .info {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.95);
        padding: 15px 20px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        font-size: 14px;
        color: #555;
      }

      .settings-btn {
        flex: 1;
        padding: 8px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f5f5f5;
        cursor: pointer;
        font-size: 13px;
        transition:
          background 0.2s,
          transform 0.1s;
      }

      .settings-btn:hover {
        background: #e0e0e0;
      }

      .settings-btn:active {
        transform: scale(0.96);
      }

      .save-btn {
        background: #4caf50;
        color: white;
        border-color: #388e3c;
      }

      .save-btn:hover {
        background: #43a047;
      }

      .save-btn.saved {
        background: #2e7d32;
      }

      .toast {
        position: fixed;
        bottom: 140px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 10px 24px;
        border-radius: 20px;
        font-size: 14px;
        opacity: 0;
        transition:
          opacity 0.3s,
          transform 0.3s;
        z-index: 2000;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .result-display {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 10px 20px;
        border-radius: 25px;
        font-size: 22px;
        font-weight: bold;
        opacity: 0;
        transition: opacity 0.4s;
        z-index: 1000;
        pointer-events: none;
      }

      .result-display.visible {
        opacity: 1;
      }

      .result-display .dice-val {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        padding: 4px 12px;
        min-width: 20px;
        text-align: center;
      }

      .result-display .result-plus {
        opacity: 0.5;
        font-size: 16px;
      }

      .result-display .result-eq {
        opacity: 0.5;
        font-size: 18px;
      }

      .result-display .result-sum {
        color: #ffd700;
        font-size: 26px;
      }

      /* OBS Browser Source：透明背景、隱藏控制面板 */
      body.mode-obs {
        background: transparent !important;
      }
      body.mode-obs .controls,
      body.mode-obs .roll-button,
      body.mode-obs .info {
        display: none !important;
      }
      body.mode-obs .toast,
      body.mode-obs .roll-button {
        display: none !important;
      }
      body.mode-obs.hide-results .result-display {
        display: none !important;
      }
      .bridge-status {
        position: fixed;
        bottom: 8px;
        right: 12px;
        font-size: 11px;
        color: rgba(0, 0, 0, 0.45);
        z-index: 2000;
        pointer-events: none;
      }
      body.mode-obs .bridge-status {
        color: rgba(255, 255, 255, 0.55);
      }
      .api-badge {
        position: fixed;
        right: 12px;
        bottom: 28px;
        z-index: 2000;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        color: #9ef0c7;
        opacity: 0.9;
        pointer-events: none;
        display: none;
      }
      body.show-api-badge:not(.mode-obs) .api-badge {
        display: block;
      }
      .api-badge.offline {
        color: #ffc9c9;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <h3>🎲 投擲設定</h3>

      <div class="control-group">
        <label>投擲方向：</label>
        <div class="direction-selector">
          <div class="direction-btn placeholder"></div>
          <div class="direction-btn active" data-direction="top">⬇️ 上方</div>
          <div class="direction-btn placeholder"></div>
          <div class="direction-btn" data-direction="left">➡️ 左側</div>
          <div class="direction-btn placeholder"></div>
          <div class="direction-btn" data-direction="right">⬅️ 右側</div>
          <div class="direction-btn placeholder"></div>
          <div class="direction-btn" data-direction="bottom">⬆️ 下方</div>
          <div class="direction-btn placeholder"></div>
        </div>
      </div>

      <div class="control-group">
        <label>骰子外觀：</label>
        <div class="theme-selector">
          <div class="theme-btn active" data-theme="classic">
            <span
              class="color-dot"
              style="background: #fff; border-color: #ccc"
            ></span
            >經典白
          </div>
          <div class="theme-btn" data-theme="dark">
            <span class="color-dot" style="background: #2d2d44"></span>深色夜光
          </div>
          <div class="theme-btn" data-theme="wooden">
            <span
              class="color-dot"
              style="background: #f5e6d0; border-color: #b8860b"
            ></span
            >木質溫潤
          </div>
          <div class="theme-btn" data-theme="ocean">
            <span
              class="color-dot"
              style="background: #e3f2fd; border-color: #90caf9"
            ></span
            >海洋藍
          </div>
          <div class="theme-btn" data-theme="neon">
            <span
              class="color-dot"
              style="background: #1a1a1a; border-color: #00ff88"
            ></span
            >霓虹派對
          </div>
        </div>
      </div>

      <div class="control-group">
        <label>
          初始速度：<span class="value-display" id="velocityValue">300</span>
          px/s
        </label>
        <input
          type="range"
          id="velocitySlider"
          min="100"
          max="500"
          value="300"
          step="10"
        />
      </div>

      <div class="control-group">
        <label>
          投擲距離：<span class="value-display" id="distanceValue">400</span> px
        </label>
        <input
          type="range"
          id="distanceSlider"
          min="200"
          max="800"
          value="400"
          step="20"
        />
      </div>

      <div class="control-group">
        <label>
          重力：<span class="value-display" id="gravityValue">1200</span> px/s²
        </label>
        <input
          type="range"
          id="gravitySlider"
          min="800"
          max="2000"
          value="1200"
          step="50"
        />
      </div>

      <div class="control-group">
        <label>
          點數大小：<span class="value-display" id="dotSizeValue">10</span> px
        </label>
        <input
          type="range"
          id="dotSizeSlider"
          min="6"
          max="16"
          value="10"
          step="1"
        />
      </div>

      <div class="control-group">
        <label>
          一點大小：<span class="value-display" id="dot1SizeValue">20</span> px
        </label>
        <input
          type="range"
          id="dot1SizeSlider"
          min="12"
          max="30"
          value="20"
          step="1"
        />
      </div>

      <div class="control-group">
        <label>
          點距（靠近中心）：<span class="value-display" id="dotInsetValue"
            >6</span
          >
          px
        </label>
        <input
          type="range"
          id="dotInsetSlider"
          min="2"
          max="14"
          value="6"
          step="1"
        />
      </div>

      <div class="control-group">
        <label>
          骰子圓角：<span class="value-display" id="diceRadiusValue">10</span>
          px
        </label>
        <input
          type="range"
          id="diceRadiusSlider"
          min="0"
          max="20"
          value="10"
          step="1"
        />
      </div>

      <div class="control-group">
        <label>
          音量：<span class="value-display" id="volumeValue">100</span> %
        </label>
        <input
          type="range"
          id="volumeSlider"
          min="0"
          max="100"
          value="100"
          step="1"
        />
      </div>

      <div
        class="control-group"
        style="margin-top: 8px; display: flex; gap: 8px"
      >
        <button class="settings-btn save-btn" id="saveSettingsBtn">
          儲存設定
        </button>
        <button class="settings-btn" id="resetSettingsBtn">重置預設</button>
      </div>
    </div>

    <div class="scene">
      <div class="inner-scene">
        <div class="shadow-layer" id="shadows"></div>
        <div class="dice-layer" id="dices"></div>
      </div>
    </div>

    <button class="roll-button" id="rollBtn" onclick="throwDice()">
      擲骰子
    </button>

      <div class="result-display" id="resultDisplay"></div>
      <div class="toast" id="toast"></div>
      <div class="bridge-status" id="bridgeStatus"></div>

    <div class="info">載入配置文件中...</div>
    <div class="api-badge offline" id="apiBadge">API: 未連線</div>

    <script>
      let config = null;
      let currentDirection = "top";
      const diceIds = [1, 2, 3];
      const diceState = {
        1: { rx: 0, ry: 0, currentX: -160, currentY: 0 },
        2: { rx: 0, ry: 0, currentX: 0, currentY: 0 },
        3: { rx: 0, ry: 0, currentX: 160, currentY: 0 },
      };
      let gridConfig = { 1: [-160, 0], 2: [0, 0], 3: [160, 0] };
      let currentTheme = "classic";

      const DICE_THEMES = {
        classic: {
          name: "經典白",
          bgColor: "#e5e5e5",
          faceColor: "#fff",
          borderColor: "#ccc",
          normalDot: "#333",
          specialDot: "#d32f2f",
        },
        dark: {
          name: "深色夜光",
          bgColor: "#1a1a2e",
          faceColor: "#2d2d44",
          borderColor: "#444466",
          normalDot: "#e0e0e0",
          specialDot: "#ff4444",
        },
        wooden: {
          name: "木質溫潤",
          bgColor: "#d4a574",
          faceColor: "#f5e6d0",
          borderColor: "#b8860b",
          normalDot: "#4a2c0a",
          specialDot: "#8b0000",
        },
        ocean: {
          name: "海洋藍",
          bgColor: "#e3f2fd",
          faceColor: "#ffffff",
          borderColor: "#90caf9",
          normalDot: "#1565c0",
          specialDot: "#e53935",
        },
        neon: {
          name: "霓虹派對",
          bgColor: "#0a0a0a",
          faceColor: "#1a1a1a",
          borderColor: "#333",
          normalDot: "#00ff88",
          specialDot: "#ff00aa",
        },
      };

      const DEFAULT_CLIP_COUNT = 11;
      const DEFAULT_CLIP_DIR = "./voice/clips/";

      let audioCtx = null;
      let audioGain = null;
      let audioBuffers = [];
      let audioFallbackClips = [];
      let audioUnlocked = false;

      function getClipPaths() {
        if (config?.sound?.clips) return config.sound.clips;
        const dir = config?.sound?.clipDir?.value || DEFAULT_CLIP_DIR;
        const count = config?.sound?.clipCount?.value || DEFAULT_CLIP_COUNT;
        return Array.from(
          { length: count },
          (_, i) => `${dir}hit_${String(i + 1).padStart(2, "0")}.wav`,
        );
      }

      async function initAudio() {
        const clips = getClipPaths();
        const volume = config?.sound?.volume?.value ?? 1.0;

        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          audioGain = audioCtx.createGain();
          audioGain.connect(audioCtx.destination);
          audioGain.gain.value = volume;
          const results = await Promise.allSettled(
            clips.map(async (src) => {
              const resp = await fetch(src);
              const buf = await resp.arrayBuffer();
              return audioCtx.decodeAudioData(buf);
            }),
          );
          audioBuffers = results
            .filter((r) => r.status === "fulfilled")
            .map((r) => r.value);
          if (audioBuffers.length > 0) {
            console.log(
              `音效系統初始化完成 (Web Audio API, ${audioBuffers.length} clips)`,
            );
            return;
          }
        } catch (e) {
          console.warn("Web Audio API 載入失敗，使用 HTML Audio 備援:", e);
          audioCtx = null;
        }

        try {
          clips.forEach((src) => {
            const a = new Audio(src);
            a.preload = "auto";
            a.volume = volume;
            a.load();
            audioFallbackClips.push(a);
          });
          console.log(
            `音效系統初始化完成 (HTML Audio, ${audioFallbackClips.length} clips)`,
          );
        } catch (e) {
          console.warn("音效系統完全不可用:", e);
        }
      }

      function playRandomRollSound(volumeScale) {
        if (volumeScale === undefined) volumeScale = 1.0;
        if (audioCtx && audioBuffers.length > 0) {
          if (audioCtx.state === "suspended") audioCtx.resume();
          const buf =
            audioBuffers[Math.floor(Math.random() * audioBuffers.length)];
          const source = audioCtx.createBufferSource();
          source.buffer = buf;
          const gain = audioCtx.createGain();
          gain.gain.value = volumeScale;
          source.connect(gain);
          gain.connect(audioGain);
          source.start(0);
          return;
        }
        if (audioFallbackClips.length > 0) {
          const tpl =
            audioFallbackClips[
              Math.floor(Math.random() * audioFallbackClips.length)
            ];
          const sound = tpl.cloneNode();
          sound.volume = volumeScale * (config?.sound?.volume?.value ?? 1.0);
          sound.play().catch(() => {});
        }
      }

      function applyVolume(percent) {
        const vol = percent / 100;
        if (audioGain) audioGain.gain.value = vol;
        audioFallbackClips.forEach((c) => (c.volume = vol));
      }

      const SETTINGS_KEY = "dice-settings";
      const SLIDER_DEFS = [
        { id: "velocitySlider", display: "velocityValue" },
        { id: "distanceSlider", display: "distanceValue" },
        { id: "gravitySlider", display: "gravityValue" },
        {
          id: "dotSizeSlider",
          display: "dotSizeValue",
          css: "--dot-size",
          unit: "px",
        },
        {
          id: "dot1SizeSlider",
          display: "dot1SizeValue",
          css: "--special-dot-size",
          unit: "px",
        },
        {
          id: "dotInsetSlider",
          display: "dotInsetValue",
          css: "--face-padding",
          unit: "px",
        },
        {
          id: "diceRadiusSlider",
          display: "diceRadiusValue",
          css: "--dice-radius",
          unit: "px",
        },
        { id: "volumeSlider", display: "volumeValue" },
      ];

      function showToast(msg, duration) {
        if (!duration) duration = 1500;
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove("show"), duration);
      }

      function saveSettings(silent) {
        const data = {};
        SLIDER_DEFS.forEach((s) => {
          data[s.id] = document.getElementById(s.id).value;
        });
        data.direction = currentDirection;
        data.theme = currentTheme;
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(data));
        if (!silent) showToast("設定已儲存");
      }

      function loadSettings() {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (!raw) return;
        try {
          const data = JSON.parse(raw);
          SLIDER_DEFS.forEach((s) => {
            if (data[s.id] == null) return;
            const el = document.getElementById(s.id);
            el.value = data[s.id];
            document.getElementById(s.display).textContent = data[s.id];
            if (s.css) {
              document.documentElement.style.setProperty(
                s.css,
                data[s.id] + (s.unit || ""),
              );
            }
          });
          if (data.volumeSlider != null)
            applyVolume(parseInt(data.volumeSlider));
          if (data.direction) {
            currentDirection = data.direction;
            document
              .querySelectorAll(".direction-btn")
              .forEach((b) => b.classList.remove("active"));
            const ab = document.querySelector(
              `.direction-btn[data-direction="${data.direction}"]`,
            );
            if (ab) ab.classList.add("active");
          }
          if (data.theme) {
            applyTheme(data.theme);
          }
        } catch (e) {
          console.warn("設定載入失敗:", e);
        }
      }

      function resetSettings() {
        localStorage.removeItem(SETTINGS_KEY);
        SLIDER_DEFS.forEach((s) => {
          const el = document.getElementById(s.id);
          const def = el.defaultValue;
          el.value = def;
          document.getElementById(s.display).textContent = def;
          if (s.css) {
            document.documentElement.style.setProperty(
              s.css,
              def + (s.unit || ""),
            );
          }
        });
        applyVolume(100);
        currentDirection = "top";
        document
          .querySelectorAll(".direction-btn")
          .forEach((b) => b.classList.remove("active"));
        const topBtn = document.querySelector(
          '.direction-btn[data-direction="top"]',
        );
        if (topBtn) topBtn.classList.add("active");
        applyTheme("classic");
      }

      function applyTheme(themeKey) {
        const theme = DICE_THEMES[themeKey];
        if (!theme) return;
        currentTheme = themeKey;
        const root = document.documentElement;
        root.style.setProperty("--bg-color", theme.bgColor);
        root.style.setProperty("--dice-face-color", theme.faceColor);
        root.style.setProperty("--dice-border-color", theme.borderColor);
        root.style.setProperty("--normal-dot-color", theme.normalDot);
        root.style.setProperty("--special-dot-color", theme.specialDot);
        document
          .querySelectorAll(".theme-btn")
          .forEach((b) => b.classList.remove("active"));
        const activeBtn = document.querySelector(
          `.theme-btn[data-theme="${themeKey}"]`,
        );
        if (activeBtn) activeBtn.classList.add("active");
        updateInfo(`主題已切換至：${theme.name}`);
      }

      // 載入配置文件
      async function loadConfig() {
        try {
          const response = await fetch("./config/dice-config.json");
          config = await response.json();
          applyConfig();
          updateInfo("✅ 配置已載入");
        } catch (error) {
          console.error("載入配置失敗:", error);
          updateInfo("⚠️ 使用預設配置");
          useDefaultConfig();
        }
      }

      function useDefaultConfig() {
        config = {
          visual: { diceSize: { value: 60 } },
          physics: {
            initialVelocity: { value: 300 },
            throwDistance: { value: 400 },
            gravity: { value: 1200 },
            pullHeight: { min: 200, max: 300 },
            pullTime: { min: 150, max: 250 },
            spinDuration: { min: 1600, max: 2400 },
            moveDuration: { min: 1400, max: 2000 },
            bounceFrequency: { min: 2.2, max: 3.2 },
            tiltAngle: { min: -60, max: 60 },
          },
          layout: {
            dicePositions: {
              1: { x: -160, y: 0 },
              2: { x: 0, y: 0 },
              3: { x: 160, y: 0 },
            },
            targetSpread: { x: 40, y: 40 },
          },
          directions: {
            default: "top",
            offsets: {
              top: { startOffset: { x: 0, y: -1 } },
              bottom: { startOffset: { x: 0, y: 1 } },
              left: { startOffset: { x: -1, y: 0 } },
              right: { startOffset: { x: 1, y: 0 } },
            },
          },
          animation: {
            spinRotation: { value: 1080 },

      function applyConfig() {
        // 更新CSS變量
        const root = document.documentElement;
        if (config.visual) {
          if (config.visual.diceSize)
            root.style.setProperty(
              "--dice-size",
              config.visual.diceSize.value + "px",
            );
          if (config.visual.sceneWidth)
            root.style.setProperty(
              "--scene-width",
              config.visual.sceneWidth.value + "px",
            );
          if (config.visual.sceneHeight)
            root.style.setProperty(
              "--scene-height",
              config.visual.sceneHeight.value + "px",
            );
          if (config.visual.perspective)
            root.style.setProperty(
              "--perspective",
              config.visual.perspective.value + "px",
            );
          if (config.visual.sceneRotationX)
            root.style.setProperty(
              "--scene-rotation",
              config.visual.sceneRotationX.value + "deg",
            );
        }

        if (config.colors) {
          if (config.colors.background)
            root.style.setProperty(
              "--bg-color",
              config.colors.background.value,
            );
          if (config.colors.diceFace)
            root.style.setProperty(
              "--dice-face-color",
              config.colors.diceFace.value,
            );
          if (config.colors.diceBorder)
            root.style.setProperty(
              "--dice-border-color",
              config.colors.diceBorder.value,
            );
          if (config.colors.normalDot)
            root.style.setProperty(
              "--normal-dot-color",
              config.colors.normalDot.value,
            );
          if (config.colors.specialDot)
            root.style.setProperty(
              "--special-dot-color",
              config.colors.specialDot.value,
            );
        }

        if (config.animation && config.animation.shadowBlur) {
          root.style.setProperty(
            "--shadow-blur",
            config.animation.shadowBlur.value + "px",
          );
        }

        // 更新骰子位置配置
        if (config.layout && config.layout.dicePositions) {
          gridConfig = {
            1: [
              config.layout.dicePositions["1"].x,
              config.layout.dicePositions["1"].y,
            ],
            2: [
              config.layout.dicePositions["2"].x,
              config.layout.dicePositions["2"].y,
            ],
            3: [
              config.layout.dicePositions["3"].x,
              config.layout.dicePositions["3"].y,
            ],
          };
          diceIds.forEach((id) => {
            diceState[id].currentX = gridConfig[id][0];
            diceState[id].currentY = gridConfig[id][1];
          });
        }

        // 更新滑桿初始值
        if (config.physics) {
          if (config.physics.initialVelocity) {
            document.getElementById("velocitySlider").value =
              config.physics.initialVelocity.value;
            document.getElementById("velocityValue").textContent =
              config.physics.initialVelocity.value;
          }
          if (config.physics.throwDistance) {
            document.getElementById("distanceSlider").value =
              config.physics.throwDistance.value;
            document.getElementById("distanceValue").textContent =
              config.physics.throwDistance.value;
          }
          if (config.physics.gravity) {
            document.getElementById("gravitySlider").value =
              config.physics.gravity.value;
            document.getElementById("gravityValue").textContent =
              config.physics.gravity.value;
          }
        }

        // 設定預設方向
        if (config.directions && config.directions.default) {
          currentDirection = config.directions.default;
        }
      }

      function updateInfo(text) {
        document.querySelector(".info").textContent = text;
      }

      const getRandom = (min, max) => Math.random() * (max - min) + min;

      function initScene() {
        const shadowLayer = document.getElementById("shadows");
        const diceLayer = document.getElementById("dices");
        const dotMap = {
          1: [4],
          2: [0, 8],
          3: [0, 4, 8],
          4: [0, 2, 6, 8],
          5: [0, 2, 4, 6, 8],
          6: [0, 2, 3, 5, 6, 8],
        };

        diceIds.forEach((id) => {
          shadowLayer.innerHTML += `<div id="sh-${id}" class="shadow"></div>`;
          diceLayer.innerHTML += `
                <div class="dice-group" id="group-${id}">
                    <div class="dice-wrapper" id="wrap-${id}">
                        <div class="dice" id="dice-${id}"></div>
                    </div>
                </div>`;
          const diceEl = document.getElementById(`dice-${id}`);
          for (let i = 1; i <= 6; i++) {
            const f = document.createElement("div");
            f.className = `face face-${i}`;
            dotMap[i].forEach((p) => {
              const d = document.createElement("div");
              d.className = "dot";
              d.style.gridArea = `${Math.floor(p / 3) + 1} / ${(p % 3) + 1}`;
              f.appendChild(d);
            });
            diceEl.appendChild(f);
          }
          const faceRotMap = {
            1: [0, 0],
            2: [0, -90],
            3: [0, -180],
            4: [0, 90],
            5: [-90, 0],
            6: [90, 0],
          };
          const initFace = Math.floor(Math.random() * 6) + 1;
          diceState[id].rx = faceRotMap[initFace][0];
          diceState[id].ry = faceRotMap[initFace][1];
          diceEl.style.transform = `rotateX(${diceState[id].rx}deg) rotateY(${diceState[id].ry}deg)`;
          updateDicePos(
            id,
            diceState[id].currentX,
            diceState[id].currentY,
            30,
            0,
            0.7,
          );
        });
      }

      function updateDicePos(id, x, y, z, tilt, shOpacity) {
        const group = document.getElementById(`group-${id}`);
        const wrap = document.getElementById(`wrap-${id}`);
        const sh = document.getElementById(`sh-${id}`);

        group.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        wrap.style.transform = `translateZ(${z}px) rotateZ(${tilt}deg)`;

        const shScale = 1 + (z - 30) / 120;
        sh.style.transform = `translate3d(${x}px, ${y}px, -2px) scale(${shScale})`;
        sh.style.opacity = shOpacity;
      }

      let isThrowing = false;
      let lastResults = null;
      let pendingValues = null;

      async function throwDice(options) {
        options = options || {};
        if (!config) {
          console.error("配置尚未載入");
          updateInfo("❌ 配置尚未載入");
          return null;
        }
        if (isThrowing) {
          console.warn("擲骰進行中，忽略重複請求");
          return null;
        }
        isThrowing = true;

        if (options.direction) {
          setDirection(options.direction, true);
        }
        if (options.theme) {
          applyTheme(options.theme);
        }

        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        if (audioFallbackClips.length > 0 && !audioUnlocked) {
          const u = audioFallbackClips[0].cloneNode();
          u.volume = 0;
          u.play()
            .then(() => {
              u.pause();
              audioUnlocked = true;
            })
            .catch(() => {});
        }
        const btn = document.getElementById("rollBtn");
        if (btn) btn.disabled = true;

        const velocity = parseFloat(
          document.getElementById("velocitySlider").value,
        );
        const distance = parseFloat(
          document.getElementById("distanceSlider").value,
        );
        const gravity = parseFloat(
          document.getElementById("gravitySlider").value,
        );

        const directionOffset =
          config.directions.offsets[currentDirection].startOffset;

        const resultDisplay = document.getElementById("resultDisplay");
        resultDisplay.classList.remove("visible");

        const forced =
          options.values ||
          pendingValues ||
          null;
        pendingValues = null;

        const diceResults = {};
        const animations = diceIds.map((id, index) => {
          return new Promise((resolve) => {
            const wrap = document.getElementById(`wrap-${id}`);
            const dice = document.getElementById(`dice-${id}`);

            const base = gridConfig[id];
            const spreadX = config.layout.targetSpread.x;
            const spreadY = config.layout.targetSpread.y;
            const targetX = base[0] + getRandom(-spreadX, spreadX);
            const targetY = base[1] + getRandom(-spreadY, spreadY);

            // 計算起始位置（根據方向）
            const startX = targetX + directionOffset.x * distance;
            const startY = targetY + directionOffset.y * distance;

            // 設置骰子到起始位置（不可見）
            diceState[id].currentX = startX;
            diceState[id].currentY = startY;

            let res = Math.floor(Math.random() * 6) + 1;
            if (forced && forced[index] != null) {
              const n = parseInt(forced[index], 10);
              if (n >= 1 && n <= 6) res = n;
            }
            diceResults[id] = res;
            const rotations = {
              1: [0, 0],
              2: [0, -90],
              3: [0, -180],
              4: [0, 90],
              5: [-90, 0],
              6: [90, 0],
            };

            const randomTilt = getRandom(
              config.physics.tiltAngle.min,
              config.physics.tiltAngle.max,
            );

            const startFace = Math.floor(Math.random() * 6) + 1;
            dice.style.transition = "none";
            dice.style.transform = `rotateX(${rotations[startFace][0]}deg) rotateY(${rotations[startFace][1]}deg)`;
            const extraSpinX = Math.floor(getRandom(-2, 3)) * 360;
            const extraSpinY = Math.floor(getRandom(-2, 3)) * 360;
            diceState[id].rx =
              config.animation.spinRotation.value +
              extraSpinX +
              rotations[res][0];
            diceState[id].ry =
              config.animation.spinRotation.value +
              extraSpinY +
              rotations[res][1];

            const pullHeight = getRandom(
              config.physics.pullHeight.min,
              config.physics.pullHeight.max,
            );
            const pullTime = getRandom(
              config.physics.pullTime.min,
              config.physics.pullTime.max,
            );

            updateDicePos(id, startX, startY, 0, randomTilt, 0);

            const airDelay = getRandom(0, 100);

            setTimeout(() => {
              wrap.style.transition = `transform ${pullTime}ms ease-out`;
              wrap.style.transform = `translateZ(${pullHeight}px) rotateZ(${randomTilt}deg)`;

              setTimeout(() => {
                wrap.style.transition = "none";
                const spinDuration =
                  getRandom(
                    config.physics.spinDuration.min,
                    config.physics.spinDuration.max,
                  ) + airDelay;
                dice.style.transition = `transform ${spinDuration}ms cubic-bezier(0.15, 0.85, 0.3, 1)`;
                dice.style.transform = `rotateX(${diceState[id].rx}deg) rotateY(${diceState[id].ry}deg)`;

                const animConfig = {
                  duration: getRandom(
                    config.physics.moveDuration.min,
                    config.physics.moveDuration.max,
                  ),
                  startHeight: pullHeight,
                  startX,
                  startY,
                  targetX,
                  targetY,
                  tilt: randomTilt,
                  freq: getRandom(
                    config.physics.bounceFrequency.min,
                    config.physics.bounceFrequency.max,
                  ),
                  velocity,
                  gravity,
                };

                setTimeout(() => {
                  animatePhysicalMove(id, animConfig, resolve);
                }, airDelay);
              }, pullTime);
            }, 50);
          });
        });

        await Promise.all(animations);
        if (btn) btn.disabled = false;
        isThrowing = false;
        lastResults = { ...diceResults };
        showResults(diceResults);
        publishEvent({
          type: "dice.rolled",
          results: lastResults,
          values: Object.keys(lastResults)
            .sort()
            .map((k) => lastResults[k]),
          direction: currentDirection,
          theme: currentTheme,
        });
        return lastResults;
      }

      function showResults(results) {
        const display = document.getElementById("resultDisplay");
        const ids = Object.keys(results).sort();
        const vals = ids.map((id) => results[id]);
        const sum = vals.reduce((a, b) => a + b, 0);

        let html = "";
        vals.forEach((v, i) => {
          if (i > 0) html += '<span class="result-plus">+</span>';
          html += `<span class="dice-val">${v}</span>`;
        });
        if (vals.length > 1) {
          html += '<span class="result-eq">=</span>';
          html += `<span class="result-sum">${sum}</span>`;
        }

        display.innerHTML = html;
        display.classList.add("visible");
      }

      function setDirection(dir, silent) {
        const known = ["top", "bottom", "left", "right"];
        if (config?.directions?.offsets) {
          if (!config.directions.offsets[dir]) return false;
        } else if (!known.includes(dir)) {
          return false;
        }
        currentDirection = dir;
        document
          .querySelectorAll(".direction-btn")
          .forEach((b) => b.classList.remove("active"));
        const ab = document.querySelector(
          `.direction-btn[data-direction="${dir}"]`,
        );
        if (ab) ab.classList.add("active");
        if (!silent) updateInfo(`投擲方向：${dir}`);
        return true;
      }

      function setBridgeStatus(text) {
        const el = document.getElementById("bridgeStatus");
        if (el) el.textContent = text || "";
      }

      let bridgeSocket = null;
      let bridgeReconnectTimer = null;

      function publishEvent(event) {
        try {
          window.dispatchEvent(
            new CustomEvent("skymiku-dice", { detail: event }),
          );
        } catch (_) {}
        if (controlChannel) {
          try {
            controlChannel.postMessage(event);
          } catch (_) {}
        }
        if (bridgeSocket && bridgeSocket.readyState === WebSocket.OPEN) {
          bridgeSocket.send(JSON.stringify({ ...event, source: "overlay" }));
        }
        const badge = document.getElementById("apiBadge");
        if (badge && event.type === "dice.rolled") {
          badge.classList.remove("offline");
          badge.textContent =
            "結果: " +
            (event.values || []).join("+") +
            " = " +
            (event.values || []).reduce((a, b) => a + b, 0);
        }
      }

      let controlChannel = null;
      try {
        controlChannel = new BroadcastChannel("skymiku-dice");
        controlChannel.onmessage = (ev) => handleControlCommand(ev.data);
      } catch (_) {
        controlChannel = null;
      }

      function handleControlCommand(cmd) {
        if (!cmd || typeof cmd !== "object") return;
        const type = cmd.type || cmd.action || cmd.command;
        const values = normalizeValues(cmd.values);
        if (type === "dice.roll" || type === "roll") {
          throwDice({
            direction: cmd.direction,
            theme: cmd.theme,
            values,
          });
          return;
        }
        if (type === "dice.set_direction" || type === "set_direction") {
          setDirection(cmd.direction);
          return;
        }
        if (type === "dice.set_theme" || type === "set_theme") {
          applyTheme(cmd.theme);
          return;
        }
        if (type === "dice.set_values" || type === "set_values") {
          pendingValues = values;
          return;
        }
        if (type === "ping") {
          publishEvent({ type: "pong", t: Date.now() });
        }
      }

      function normalizeValues(raw) {
        if (raw == null) return null;
        let arr = raw;
        if (typeof raw === "string") {
          arr = raw.split(/[,\s]+/).filter(Boolean);
        }
        if (!Array.isArray(arr)) return null;
        const nums = arr.map((v) => parseInt(v, 10)).filter((n) => n >= 1 && n <= 6);
        return nums.length ? nums : null;
      }

      function connectBridge(url) {
        if (!url) return;
        if (bridgeSocket) {
          try {
            bridgeSocket.close();
          } catch (_) {}
        }
        setBridgeStatus("橋接連線中…");
        try {
          bridgeSocket = new WebSocket(url);
        } catch (e) {
          setBridgeStatus("橋接連線失敗");
          console.warn(e);
          return;
        }
        bridgeSocket.onopen = () => {
          setBridgeStatus("橋接已連線");
          const badge = document.getElementById("apiBadge");
          if (badge) {
            badge.classList.remove("offline");
            badge.textContent = "API: 橋接已連線";
          }
          bridgeSocket.send(
            JSON.stringify({ type: "client.hello", role: "overlay" }),
          );
        };
        bridgeSocket.onmessage = (ev) => {
          try {
            handleControlCommand(JSON.parse(ev.data));
          } catch (e) {
            console.warn("橋接訊息解析失敗", e);
          }
        };
        bridgeSocket.onclose = () => {
          setBridgeStatus("橋接已斷線（重試中）");
          clearTimeout(bridgeReconnectTimer);
          bridgeReconnectTimer = setTimeout(() => connectBridge(url), 2000);
        };
        bridgeSocket.onerror = () => {
          setBridgeStatus("橋接錯誤");
        };
      }

      function applyUrlBootstrap(params) {
        const mode = params.get("mode") || "";
        if (mode === "obs" || mode === "overlay") {
          document.body.classList.add("mode-obs");
        }
        if (params.get("hideResults") === "1") {
          document.body.classList.add("hide-results");
        }
        if (params.get("direction")) setDirection(params.get("direction"), true);
        if (params.get("theme")) applyTheme(params.get("theme"));
        if (params.get("values")) {
          pendingValues = params
            .get("values")
            .split(",")
            .map((s) => parseInt(s.trim(), 10));
        }
        const bridgeParam = params.get("bridge");
        let bridgeUrl = null;
        if (bridgeParam === "1" || bridgeParam === "true") {
          bridgeUrl = "ws://127.0.0.1:28888/ws";
        } else if (bridgeParam && bridgeParam.startsWith("ws")) {
          bridgeUrl = bridgeParam;
        } else if (mode === "obs" || mode === "overlay") {
          // OBS 預設嘗試本機橋接（可 ?bridge=0 關閉）
          if (bridgeParam !== "0" && bridgeParam !== "false") {
            bridgeUrl = "ws://127.0.0.1:28888/ws";
          }
        }
        if (bridgeUrl) connectBridge(bridgeUrl);
        if (params.get("roll") === "1") {
          setTimeout(() => throwDice(), 400);
        }
      }

      window.SkymikuDice = {
        roll: (opts) => throwDice(opts || {}),
        setDirection,
        setTheme: applyTheme,
        getLastResults: () => lastResults,
        connectBridge,
        handleCommand: handleControlCommand,
      };

      window.addEventListener("message", (ev) => {
        const data = ev.data;
        if (!data) return;
        if (data.type && String(data.type).startsWith("dice.")) {
          handleControlCommand(data);
        } else if (data.skymikuDice) {
          handleControlCommand(data.skymikuDice);
        }
      });

      function animatePhysicalMove(id, animConfig, onComplete) {
        let start = null;
        let bounceCount = 0;
        let prevBounce = Infinity;
        let prevPrevBounce = Infinity;
        const maxBounceSound = 4;
        const halfSize = 30;
        const {
          duration,
          startHeight,
          startX,
          startY,
          targetX,
          targetY,
          tilt,
          freq,
        } = animConfig;

        function step(now) {
          if (!start) start = now;
          const p = (now - start) / duration;

          if (p >= 1) {
            diceState[id].currentX = targetX;
            diceState[id].currentY = targetY;
            updateDicePos(id, targetX, targetY, halfSize, tilt, 0.7);
            playRandomRollSound(0.12);
            if (onComplete) onComplete();
            return;
          }

          const bounce =
            Math.abs(Math.cos(p * Math.PI * freq)) *
            Math.pow(1 - p, 1.5) *
            startHeight;
          const z = bounce + halfSize;

          if (
            prevPrevBounce > prevBounce &&
            prevBounce <= bounce &&
            prevBounce < 8 &&
            p > 0.08 &&
            bounceCount < maxBounceSound
          ) {
            const vol = Math.pow(0.45, bounceCount);
            playRandomRollSound(vol);
            bounceCount++;
          }
          prevPrevBounce = prevBounce;
          prevBounce = bounce;

          const easeOut = 1 - Math.pow(1 - p, 3);
          const currentX = startX + (targetX - startX) * easeOut;
          const currentY = startY + (targetY - startY) * easeOut;

          const shOpacity = Math.max(
            0,
            config.animation.shadowOpacity.value - bounce / startHeight,
          );

          updateDicePos(id, currentX, currentY, z, tilt, shOpacity);
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      // 事件監聽器
      document
        .querySelectorAll(".direction-btn:not(.placeholder)")
        .forEach((btn) => {
          btn.addEventListener("click", function () {
            document
              .querySelectorAll(".direction-btn")
              .forEach((b) => b.classList.remove("active"));
            this.classList.add("active");
            currentDirection = this.dataset.direction;
            updateInfo(`方向已切換至：${this.textContent.trim()}`);
            saveSettings(true);
          });
        });

      document
        .getElementById("velocitySlider")
        .addEventListener("input", function () {
          document.getElementById("velocityValue").textContent = this.value;
          saveSettings(true);
        });

      document
        .getElementById("distanceSlider")
        .addEventListener("input", function () {
          document.getElementById("distanceValue").textContent = this.value;
          saveSettings(true);
        });

      document
        .getElementById("gravitySlider")
        .addEventListener("input", function () {
          document.getElementById("gravityValue").textContent = this.value;
          saveSettings(true);
        });

      document.querySelectorAll(".theme-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          applyTheme(this.dataset.theme);
          saveSettings(true);
        });
      });

      document
        .getElementById("dotSizeSlider")
        .addEventListener("input", function () {
          const size = parseInt(this.value);
          document.getElementById("dotSizeValue").textContent = size;
          document.documentElement.style.setProperty("--dot-size", size + "px");
          saveSettings(true);
        });

      document
        .getElementById("dot1SizeSlider")
        .addEventListener("input", function () {
          const size = parseInt(this.value);
          document.getElementById("dot1SizeValue").textContent = size;
          document.documentElement.style.setProperty(
            "--special-dot-size",
            size + "px",
          );
          saveSettings(true);
        });

      document
        .getElementById("dotInsetSlider")
        .addEventListener("input", function () {
          const val = parseInt(this.value);
          document.getElementById("dotInsetValue").textContent = val;
          document.documentElement.style.setProperty(
            "--face-padding",
            val + "px",
          );
          saveSettings(true);
        });

      document
        .getElementById("diceRadiusSlider")
        .addEventListener("input", function () {
          const val = parseInt(this.value);
          document.getElementById("diceRadiusValue").textContent = val;
          document.documentElement.style.setProperty(
            "--dice-radius",
            val + "px",
          );
          saveSettings(true);
        });

      document
        .getElementById("volumeSlider")
        .addEventListener("input", function () {
          const val = parseInt(this.value);
          document.getElementById("volumeValue").textContent = val;
          applyVolume(val);
          saveSettings(true);
        });

      document
        .getElementById("saveSettingsBtn")
        .addEventListener("click", function () {
          saveSettings();
        });

      document
        .getElementById("resetSettingsBtn")
        .addEventListener("click", function () {
          resetSettings();
          showToast("已重置為預設值");
        });

      // 初始化
      window.onload = async () => {
        const params = new URLSearchParams(window.location.search);
        // 先套用 mode=obs 外觀（不等設定）
        const modeEarly = params.get("mode") || "";
        if (modeEarly === "obs" || modeEarly === "overlay") {
          document.body.classList.add("mode-obs");
        }
        await loadConfig();
        loadSettings();
        initScene();
        initAudio();
        applyUrlBootstrap(params);
        if (params.get("debug") === "1") {
          document.body.classList.add("show-api-badge");
        }
        console.log("骰子系統初始化完成");
        console.log("當前配置:", config);
        console.log("SkymikuDice API 就緒", window.SkymikuDice);
      };
    </script>
  </body>
</html>
