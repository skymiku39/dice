<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>骰子遙控面板</title>
    <style>
      :root {
        --bg: #12141a;
        --panel: #1c2030;
        --text: #e8ecf4;
        --accent: #3d8bfd;
        --ok: #3dd68c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        background: radial-gradient(1200px 600px at 10% -10%, #243056, var(--bg));
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(420px, 100%);
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 22px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 16px;
        opacity: 0.75;
        font-size: 0.92rem;
        line-height: 1.45;
      }
      label {
        display: block;
        margin: 12px 0 6px;
        font-size: 0.85rem;
        opacity: 0.85;
      }
      select,
      input,
      button {
        width: 100%;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #0f121b;
        color: var(--text);
        padding: 10px 12px;
        font: inherit;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      button {
        margin-top: 16px;
        background: var(--accent);
        border: none;
        cursor: pointer;
        font-weight: 700;
      }
      button.secondary {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      #status {
        margin-top: 14px;
        font-size: 0.85rem;
        color: var(--ok);
      }
      #log {
        margin-top: 10px;
        font-size: 0.8rem;
        opacity: 0.7;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>骰子遙控</h1>
      <p>
        搭配本機橋接 <code>uv run python tools/control_bridge.py</code>。OBS 開
        <code>?mode=obs</code> 透明層後，由此或 API 觸發擲骰。
      </p>
      <label>方向</label>
      <select id="direction">
        <option value="top">上方</option>
        <option value="bottom">下方</option>
        <option value="left">左側</option>
        <option value="right">右側</option>
      </select>
      <label>主題</label>
      <select id="theme">
        <option value="">（不變更）</option>
        <option value="classic">經典白</option>
        <option value="dark">深色夜光</option>
        <option value="wooden">木質溫潤</option>
        <option value="ocean">海洋藍</option>
        <option value="neon">霓虹派對</option>
      </select>
      <label>指定點數（可空，例 1,2,3）</label>
      <input id="values" placeholder="留空 = 隨機" />
      <button id="rollBtn">擲骰子</button>
      <div class="row">
        <button class="secondary" id="pingBtn">Ping</button>
        <button class="secondary" id="openObs">開 OBS 預覽</button>
      </div>
      <div id="status">連線中…</div>
      <div id="log"></div>
    </div>
    <script>
      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const bridge = "ws://127.0.0.1:28888/ws";
      let ws;

      function log(msg) {
        logEl.textContent = msg;
      }

      function connect() {
        ws = new WebSocket(bridge);
        ws.onopen = () => {
          statusEl.textContent = "已連線本機橋接";
          ws.send(JSON.stringify({ type: "client.hello", role: "control" }));
        };
        ws.onclose = () => {
          statusEl.textContent = "橋接斷線，重試中…";
          setTimeout(connect, 1500);
        };
        ws.onmessage = (ev) => {
          try {
            const data = JSON.parse(ev.data);
            if (data.type === "dice.rolled") {
              log("結果: " + (data.values || []).join(" + "));
            }
          } catch (_) {}
        };
      }

      document.getElementById("rollBtn").onclick = async () => {
        const direction = document.getElementById("direction").value;
        const theme = document.getElementById("theme").value || undefined;
        const raw = document.getElementById("values").value.trim();
        const values = raw
          ? raw.split(",").map((s) => parseInt(s.trim(), 10))
          : undefined;
        const body = { direction, theme, values };
        Object.keys(body).forEach((k) => body[k] == null && delete body[k]);
        try {
          const res = await fetch("http://127.0.0.1:28888/api/roll", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          log("已送出 roll（clients=" + (data.metrics?.clients ?? "?") + "）");
        } catch (e) {
          log("API 失敗：" + e);
        }
      };

      document.getElementById("pingBtn").onclick = () => {
        if (ws?.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "ping" }));
        }
      };
      document.getElementById("openObs").onclick = () => {
        window.open("./index.html?mode=obs", "_blank");
      };

      connect();
    </script>
  </body>
</html>
